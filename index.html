<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Emilie & Marc — Save the date, 10. juli 2027" />
    <title>Emilie & Marc — Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="parallax" id="parallax">
      <section class="scene" aria-labelledby="page-title">
        <div class="world" id="world">
          <!-- Exact SVG positions. Layer 1 is closest; 11 is furthest away. -->
          <img class="layer" src="assets/layers-extended/11.png" alt="" data-depth="11" style="--y:0" />
          <img class="date-sprite" src="assets/01_10Juli.png" alt="10. juli 2027" data-depth="5" />
          <h1 id="page-title" class="names">Emilie <span>&amp;</span> Marc</h1>
          <p class="save-date">Save the date</p>
          <img class="layer" src="assets/layers-extended/10.png" alt="" data-depth="10" style="--y:1668" />
          <img class="layer" src="assets/layers-extended/9.png" alt="" data-depth="9" style="--y:1805" />
          <img class="layer" src="assets/layers-extended/8.png" alt="" data-depth="8" style="--y:2134" />
          <img class="layer" src="assets/layers-extended/7.png" alt="" data-depth="7" style="--y:1114" />
          <img class="layer" src="assets/layers-extended/6.png" alt="" data-depth="6" style="--y:934" />
          <img class="layer" src="assets/layers-extended/5.png" alt="" data-depth="5" style="--y:2134" />
          <img class="layer" src="assets/layers-extended/4.png" alt="" data-depth="4" style="--y:2213" />
          <img class="layer" src="assets/layers-extended/3.png" alt="" data-depth="3" style="--y:2074" />
          <!-- These sit before layer 2 in the stack, so they emerge from behind the green branch. -->
          <div class="bird-flight bird-flight--hero bird-flight-template" data-flight-template>
            <img class="bird-frame bird-frame--1" src="assets/birds/1.png" alt="" />
            <img class="bird-frame bird-frame--2" src="assets/birds/2.png" alt="" />
            <img class="bird-frame bird-frame--3" src="assets/birds/3.png" alt="" />
          </div>
          <div class="bird-flight bird-flight--middle bird-flight-template" data-flight-template>
            <img class="bird-frame bird-frame--1" src="assets/birds/1.png" alt="" />
            <img class="bird-frame bird-frame--2" src="assets/birds/2.png" alt="" />
            <img class="bird-frame bird-frame--3" src="assets/birds/3.png" alt="" />
          </div>
          <div class="bird-flight bird-flight--far bird-flight-template" data-flight-template>
            <img class="bird-frame bird-frame--1" src="assets/birds/1.png" alt="" />
            <img class="bird-frame bird-frame--2" src="assets/birds/2.png" alt="" />
            <img class="bird-frame bird-frame--3" src="assets/birds/3.png" alt="" />
          </div>
          <img class="layer" src="assets/layers-extended/2.png" alt="" data-depth="2" style="--y:573" />
          <img class="layer" src="assets/layers-extended/1.png" alt="" data-depth="1" style="--y:0" />
          <button class="registration-stamp" id="registration-button" type="button" aria-haspopup="dialog" aria-controls="registration-dialog">
            <img src="assets/button01.png" alt="Klik her for tilmelding" />
          </button>
        </div>
        <p class="scroll-prompt" aria-hidden="true">Scroll ned</p>
      </section>
    </main>
    <dialog class="registration-dialog" id="registration-dialog" aria-labelledby="registration-title">
      <section class="registration-card">
        <button class="dialog-close" id="registration-close" type="button" aria-label="Luk tilmelding">×</button>
        <p class="modal-kicker">Emilie &amp; Marc · 10. juli 2027</p>
        <h2 id="registration-title">Tilmelding</h2>
        <div class="modal-ornament" aria-hidden="true"><span></span>✦<span></span></div>
        <p class="registration-intro">Vi glæder os til at høre fra jer.</p>
        <form class="registration-form" id="registration-form" action="https://formspree.io/f/mppavjbe" method="POST">
          <input type="hidden" name="_subject" value="Ny bryllupstilmelding – Emilie &amp; Marc" />
          <div class="guest-name-grid">
            <div class="registration-field"><label for="first-name">Navn</label><input id="first-name" name="Navn" type="text" autocomplete="given-name" required /></div>
            <div class="registration-field"><label for="last-name">Efternavn</label><input id="last-name" name="Efternavn" type="text" autocomplete="family-name" required /></div>
          </div>
          <fieldset class="attendance-field"><legend>Kan du deltage til brylluppet?</legend><label><input type="radio" name="Deltagelse" value="Ja" required /> Ja</label><label><input type="radio" name="Deltagelse" value="Nej" /> Nej</label></fieldset>
          <div class="attendance-details" id="attendance-details" aria-hidden="true">
            <div class="registration-field"><label for="song">Hvilken sang får dig altid på dansegulvet?</label><input id="song" name="Dansegulvssang" type="text" /></div>
            <fieldset class="flavour-field"><legend>Hvilken is kan du altid spise en ekstra kugle af?</legend><p class="field-hint">Vælg op til 4 smage <span id="flavour-count">(0/4)</span></p>
              <div class="flavour-options">
                <label><input type="checkbox" name="Is-smage" value="Vanilje" /> Vanilje</label><label><input type="checkbox" name="Is-smage" value="Chokolade" /> Chokolade</label><label><input type="checkbox" name="Is-smage" value="Jordbær" /> Jordbær</label><label><input type="checkbox" name="Is-smage" value="Saltkaramel" /> Saltkaramel</label><label><input type="checkbox" name="Is-smage" value="Pistacie" /> Pistacie</label><label><input type="checkbox" name="Is-smage" value="Stracciatella" /> Stracciatella</label><label><input type="checkbox" name="Is-smage" value="Citron" /> Citron</label><label><input type="checkbox" name="Is-smage" value="Mango" /> Mango</label><label><input type="checkbox" name="Is-smage" value="Hindbærsorbet" /> Hindbærsorbet</label><label><input type="checkbox" name="Is-smage" value="Lakrids" /> Lakrids</label>
              </div>
            </fieldset>
            <div class="registration-field"><label for="allergens">Har du nogle allergener, vi skal være opmærksomme på?</label><textarea id="allergens" name="Allergener" rows="3"></textarea></div>
          </div>
          <button class="modal-button" type="submit">Send tilmelding</button>
        </form>
        <p class="registration-confirmation" id="registration-confirmation" hidden></p>
      </section>
    </dialog>
    <audio id="background-music" loop preload="auto">
      <source src="assets/audio/background.mp3" type="audio/mpeg" />
    </audio>
    <audio id="bird-sound" preload="auto">
      <source src="assets/audio/birds.mp3" type="audio/mpeg" />
    </audio>
    <script src="script.js"></script>
  </body>
</html>
